
name: Build Joni Bhai APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        run: unzip -o Joni_Bhai_Android_Cloud_Build.zip

      - name: Build APK
        working-directory: JoniBhai_Android_Project
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Joni-Bhai-APK
          path: JoniBhai_Android_Project/app/build/outputs/apk/debug/app-debug.apk
